services:
  # PostgreSQL with the PostGIS extension — we store courier location pings as
  # geography points so "which courier is nearest this Bole address" is a single
  # indexed query instead of application-side haversine math.
  db:
    image: postgis/postgis:16-3.4
    container_name: ecommerce-db
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - ecommerce-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis backs the BullMQ payment queue. It is the durable buffer that lets us
  # accept a customer's payment intent even while the Telebirr API is timing out.
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ecommerce-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ecommerce-db-data:
  ecommerce-redis-data:
